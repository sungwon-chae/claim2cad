name: CI

on:
  push:
    branches: [main, v1.0-dev]
  pull_request:
    branches: [main, v1.0-dev]

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          # Force the LLM-mocked branch — no real API key in CI.
          CLAIM2CAD_LOG_LEVEL: INFO
        run: pytest -q

      - name: Run make demo (dry-run, golden example)
        run: |
          python -m claim2cad.pipeline \
            --claim examples/golden_robot_arm/claim.txt \
            --out /tmp/demo_out \
            --dry-run
          test -s /tmp/demo_out/model.step
          test -s /tmp/demo_out/model.glb
          test -s /tmp/demo_out/claim_ir.json
          test -s /tmp/demo_out/claim_map.json

  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install viewer dependencies
        working-directory: viewer
        run: npm ci --no-audit --no-fund

      - name: Type-check viewer
        working-directory: viewer
        run: npm run typecheck

      - name: Build viewer
        working-directory: viewer
        run: npm run build
